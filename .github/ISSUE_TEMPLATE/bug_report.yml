name: Bug report
description: Something does not work as expected
labels: [bug]
body:
  - type: textarea
    id: what
    attributes:
      label: What happened?
      description: What did you do, what did you expect, and what happened instead?
    validations:
      required: true
  - type: input
    id: camera
    attributes:
      label: Camera model and firmware
      placeholder: X-E4, firmware 2.01
    validations:
      required: true
  - type: input
    id: connection
    attributes:
      label: Camera connection mode
      placeholder: USB CARD READER
  - type: input
    id: macos
    attributes:
      label: macOS version
      placeholder: macOS 15.1
    validations:
      required: true
  - type: input
    id: version
    attributes:
      label: RAW Recipes version
      placeholder: 0.1.0
    validations:
      required: true
  - type: dropdown
    id: editor
    attributes:
      label: Editor involved
      multiple: true
      options:
        - Lightroom (.xmp)
        - RapidRAW (.rrdata)
        - None / import only
  - type: textarea
    id: extra
    attributes:
      label: Screenshots or sample files
      description: A sample RAF + JPG pair helps a lot with camera-settings issues.
